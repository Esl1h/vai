name: CI

on:
  push:
    branches: [main]
  pull_request:
  # V master changes often; a weekly run catches breakage between commits.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install V
        run: |
          git clone --depth 1 https://github.com/vlang/v "$HOME/v"
          make -C "$HOME/v"
          echo "$HOME/v" >> "$GITHUB_PATH"
      # vai.local.opencode reads OpenCode's SQLite database via db.sqlite.
      - name: Install SQLite headers
        run: sudo apt-get install -y libsqlite3-dev
      - run: make check
